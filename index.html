<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gloom Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌘</text></svg>">
<link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20v-3.6L15.4 5a2 2 0 012.8 0l.8.8a2 2 0 010 2.8L7.6 20H4zM13.4 7.1l3.5 3.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6.2 7l.8 11.3A2 2 0 009 20h6a2 2 0 002-1.7L17.8 7M10 11v5M14 11v5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.8v12.4a1 1 0 001.5.86l10-6.2a1 1 0 000-1.72l-10-6.2A1 1 0 008 5.8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.8" height="14" rx="1.3"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.3"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.2 12a7.8 7.8 0 102.4-5.6M4.2 4.5v4.3h4.3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.8l4.4 4.4L19 7.4"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="13" rx="3.2"/><path d="M3.5 10.2h17M16.4 14.8h1.6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.6V12l3 1.9"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-6.6 6.6M4 20l6.6-6.6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.9"/><path d="M12 3.2v2M12 18.8v2M3.2 12h2M18.8 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M5.8 18.2l1.4-1.4M16.8 7.2l1.4-1.4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.6" r="3.3"/><path d="M3 19.6c.6-3.2 3-5 6-5s5.4 1.8 6 5M16.2 5.5a3.3 3.3 0 010 6.2M17.6 14.8c2 .5 3.3 2.1 3.6 4.8"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4.5 9.8h2.9L12 6v12l-4.6-3.8H4.5z"/><path d="M15.4 9.2a4 4 0 010 5.6M18.1 6.7a7.6 7.6 0 010 10.6"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4.5 9.8h2.9L12 6v12l-4.6-3.8H4.5z"/><path d="M16 9.6l4.4 4.8M20.4 9.6L16 14.4"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="3.2"/><path d="M4 10.2h16M8.5 3.5v3.5M15.5 3.5v3.5"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M7 3.5h7.2L19 8.3V18a2.5 2.5 0 01-2.5 2.5h-9A2.5 2.5 0 015 18V6A2.5 2.5 0 017 3.5zM14 3.8v4.7h4.7M8.6 13h6.8M8.6 16.5h4.6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 1112 0v5.5l1.5 1.5h-15L6 16.5zM10 20.5a2 2 0 004 0"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5V4.6M7.8 8.7L12 4.5l4.2 4.2M5 14.5V17a3 3 0 003 3h8a3 3 0 003-3v-2.5"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 20.5V4.5M6 5.5h11.4l-2.3 3.7 2.3 3.8H6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6.5 14.5L12 9l5.5 5.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6.5 9.5L12 15l5.5-5.5"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <div class="brand-wrap" id="brandWrap"><button class="brand-edit" id="editNameBtn" type="button" aria-label="Edit your name" title="Edit name"><svg class="ic"><use href="#i-edit"/></svg></button><div class="brand" id="brand">Gloom</div></div>
    <nav class="tabs" id="tabs" role="tablist">
      <button data-view="today" class="on" aria-label="Today"><svg class="ic"><use href="#i-sun"/></svg><span>Today</span></button>
      <button data-view="overview" aria-label="Overview"><svg class="ic"><use href="#i-grid"/></svg><span>Overview</span></button>
      <button data-view="commissions" aria-label="Commissions"><svg class="ic"><use href="#i-wallet"/></svg><span>Commissions</span></button>
      <button data-view="tasks" aria-label="Pending"><svg class="ic"><use href="#i-list"/></svg><span>Pending</span></button>
      <button data-view="clients" aria-label="Clients"><svg class="ic"><use href="#i-users"/></svg><span>Clients</span></button>
      <i class="pill" id="pill"></i>
    </nav>
    <div class="tools"><button class="icon" id="soundBtn" data-act="sound" aria-label="Sound"><svg class="ic"><use href="#i-sound"/></svg></button>
    <div class="seg" id="currency" role="group" aria-label="Currency"><button data-cur="USD" aria-label="US dollars">$</button><button data-cur="INR" aria-label="Indian rupees">₹</button></div></div>
  </header>
  <main id="view"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="form" autocomplete="off">
    <h2 id="dlgTitle">New commission</h2>
    <label>Name<input name="name" required maxlength="80" placeholder="Logo design"></label>
    <div class="task-rate-picker" id="taskRatePicker" hidden><div class="muted">Payment type</div><div class="pay-picker" role="group" aria-label="Pending payment type"><button type="button" class="pay-option" data-edit-pay="fixed" aria-pressed="false">Fixed</button><button type="button" class="pay-option" data-edit-pay="percent" aria-pressed="false">Monthly %</button></div></div>
    <div class="row2">
      <label><span id="priceText">Price</span><input name="price" type="number" min="0" step="0.01" required placeholder="0.00" inputmode="decimal"></label>
      <label id="dateLabel">Date<input name="date" type="date" required></label>
    </div>
    <label id="clientLabel">Client<select name="client"></select></label>
    <label id="dueLabel" hidden>Deadline<input name="due" type="datetime-local"></label>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>
<dialog id="welcome" class="welcome-dialog" aria-labelledby="welcomeTitle">
  <form method="dialog" id="welcomeForm" autocomplete="off">
    <div class="eyebrow">A little setup</div>
    <h2 id="welcomeTitle">What should we call you?</h2>
    <p class="muted welcome-copy">Your name will appear at the top of your dashboard.</p>
    <label>Your name<input name="name" required maxlength="40" placeholder="Your name" autocomplete="given-name"></label>
    <div class="actions"><button class="btn primary" type="submit">Continue</button></div>
  </form>
</dialog>
<dialog id="dayConfirm" class="welcome-dialog" aria-labelledby="dayConfirmTitle">
  <form method="dialog" autocomplete="off">
    <div class="eyebrow">End of day</div>
    <h2 id="dayConfirmTitle">Are you sure you want to end today?</h2>
    <p class="muted welcome-copy">You’ll get a quick look back at what you finished.</p>
    <div class="actions"><button class="btn ghost" value="cancel">Keep going</button><button class="btn primary" value="yes">End today</button></div>
  </form>
</dialog>
<dialog id="big" class="bigdlg" aria-labelledby="bigTitle">
  <div class="big-in">
    <div class="big-head"><div><h2 id="bigTitle"></h2><div class="muted" id="bigSub"></div></div>
      <button class="icon" id="bigClose" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button></div>
    <div class="chips" id="bigChips"></div>
    <div class="big-body" id="bigBody"></div>
    <div class="legend" id="bigLegend"></div>
  </div>
</dialog>
<dialog id="cdlg">
  <form method="dialog" id="cform" autocomplete="off">
    <h2 id="cTitle">New client</h2>
    <div class="cprev" id="cPrev"></div>
    <label>Name<input name="name" required maxlength="60" placeholder="Client name"></label>
    <label>Roblox ID <input name="rbx" placeholder="Numeric ID or profile link (optional)" inputmode="text"></label>
    <div class="actions"><button type="button" class="btn ghost" id="cCancel">Cancel</button><button type="submit" class="btn primary">Save</button></div>
  </form>
</dialog>
<input type="file" id="icsFile" accept=".ics,text/calendar" hidden>
<div id="splash" class="splash" hidden>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <button class="sp-secret-close" id="spSecretClose" aria-label="Close day recap" title="Close recap">×</button>
  <div class="sp-in">
    <div class="sp-topline"><div class="eyebrow" id="spDate"></div><button class="sp-skip" id="spSkip">Skip intro</button></div>
    <div class="sp-focus"><h1 id="spGreet"></h1><blockquote id="spQuote" class="sp-quote"></blockquote><cite id="spAuthor"></cite></div>
    <section class="sp-brief" id="spBrief" aria-live="polite"></section>
    <button class="btn primary" id="spGo">Start my day</button>
    <p class="sp-farewell" id="spFarewell" hidden>See you tomorrow.</p>
  </div>
</div>
<div id="tip" class="tip"></div>

<script>
/* Load diagnostics: if a file is missing or out of date (e.g. a partial upload to GitHub), say so instead of failing silently. */
window.GLOOM_V = '10'; window.GLOOM_FILES = {};
(function () {
  function banner(msg) {
    var b = document.getElementById('gbanner');
    if (!b) { b = document.createElement('div'); b.id = 'gbanner'; b.setAttribute('role', 'alert');
      b.style.cssText = 'position:fixed;z-index:200;top:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(560px,calc(100vw - 24px));background:#1d1d1f;color:#fff;font:13px/1.45 -apple-system,system-ui,sans-serif;padding:12px 16px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);cursor:pointer';
      b.onclick = function () { b.remove(); }; document.body.appendChild(b); }
    b.textContent = msg + ' (tap to dismiss)';
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'stylesheet'))) banner('Couldn\u2019t load ' + (t.getAttribute('src') || t.getAttribute('href')).split('?')[0] + '. Upload every file in the folder, then hard-refresh.');
    else if (e.message) banner('Something went wrong: ' + e.message + '. Try a hard refresh (Ctrl/Cmd+Shift+R).');
  }, true);
  window.addEventListener('load', function () {
    var bad = ['store.js', 'dom.js', 'roblox.js', 'sound.js', 'quotes.js', 'charts.js', 'fx.js', 'app.js'].filter(function (n) { return window.GLOOM_FILES[n] !== window.GLOOM_V; });
    if (bad.length) banner('Missing or out-of-date: ' + bad.map(function (n) { return 'js/' + n; }).join(', ') + '. Re-upload the whole folder, then hard-refresh.');
  });
})();
</script>
<script src="js/store.js?v=10"></script>
<script src="js/dom.js?v=10"></script>
<script src="js/roblox.js?v=10"></script>
<script src="js/sound.js?v=10"></script>
<script src="js/quotes.js?v=10"></script>
<script src="js/charts.js?v=10"></script>
    <script src="js/fx.js?v=10"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
